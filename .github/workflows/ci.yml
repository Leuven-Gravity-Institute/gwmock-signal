name: CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    workflow_call:

jobs:
    test:
        strategy:
            matrix:
                python-version: ['3.12', '3.13', '3.14']
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: 'true'

            - name: Install dependencies
              run: uv sync --group dev --frozen

            - name: Run tests with pytest
              run: uv run --frozen pytest

            - name: Upload coverage to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

    test-jax:
        # Exercises the optional JAX/ripple waveform backend (the [jax] extra),
        # which is not part of the default install. Same Python matrix as `test`.
        strategy:
            matrix:
                python-version: ['3.12', '3.13', '3.14']
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: 'true'

            - name: Install dependencies with the JAX extra
              run: uv sync --group dev --extra jax --frozen

            # Unit tests with JAX installed: the importorskip'd ripple/JAX tests now run.
            - name: Run tests with pytest (JAX backend)
              run: uv run --frozen pytest

            # The ripple-vs-LAL overlap anchors are integration-marked. Run them
            # explicitly (scoped to the ripple suite so this job does not pull in
            # integration tests that need the pycbc/sgwb extras).
            - name: Run ripple-vs-LAL overlap anchors
              run:
                  uv run --frozen pytest -m integration
                  tests/waveform/test_ripple_backend.py
