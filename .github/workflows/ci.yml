            # should contain, so accepting new upstream content invalidates the cache in the same commit
            # that records it. `actions/cache` does not re-save on an exact hit, so a fixed identifier
            # would leave a newly added table downloading on every job.
            - name: Cache LALPulsar ephemeris tables
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ github.workspace }}/.ephemeris-cache
                  key:
                      lalpulsar-ephemeris-${{
                      hashFiles('tests/data/ephemeris.sha256') }}

            # Warms the cache on a miss and fails the job if it cannot, which reads better than tests
            # erroring with a stack trace ending in urllib. Reading the tables also verifies them: the
            # package refuses a default table whose SHA-256 is not the one it records, the same values as
            # `tests/data/ephemeris.sha256`. What the cache does not cover: GitHub evicts it after 7 days
            # without access, and fork pull requests never restore it.
            - name: Fetch and verify the ephemeris tables
              env:
                  FETCH: |
                      import sys
                      from gwmock_signal.projection.solar_system import SolarSystemEphemeris
                      try:
                          SolarSystemEphemeris().tables()
                      except ValueError as exc:
                          print(exc, file=sys.stderr)
                          sys.exit(2)
              run: |
                  # Exit 2 is a table refused for its content, cached or downloaded: retrying cannot fix it.
                  for attempt in 1 2 3; do
                      uv run --no-sync python -c "$FETCH" && exit 0 || status=$?
                      if [ "$status" -eq 2 ]; then
                          echo "::error::an ephemeris table was refused for its content (see above); retrying" \
                               "cannot fix that -- clear the cache, or update tests/data/ephemeris.sha256 and the package's record"
                          exit 1
                      fi
                      if [ "$attempt" -lt 3 ]; then
                          echo "ephemeris fetch attempt $attempt failed; retrying"
                          sleep $((attempt * 10))
                      fi
                  done
                  echo "::error::could not fetch or verify the LALPulsar ephemeris tables from git.ligo.org" \
                       "after three attempts; the projection's solar-system delays need them"
                  exit 1

            - name: Run the integration tests
              run:
                  uv run --frozen pytest -m integration
                  --ignore=tests/smoke_test.py
