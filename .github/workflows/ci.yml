name: CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    workflow_call:

jobs:
    test:
        strategy:
            matrix:
                # Latest resolutions run everywhere; the SPEC 0 minimum
                # (lowest-direct) runs on ubuntu with the oldest supported
                # Python, since floor versions predate newer interpreters'
                # wheels.
                python-version: ['3.13', '3.14', '3.15']
                os: [ubuntu-latest, macos-latest]
                resolution: [highest]
                include:
                    - os: ubuntu-latest
                      python-version: '3.13'
                      resolution: lowest-direct
        runs-on: ${{ matrix.os }}
        # One cache directory on every runner; the package's default is platform-dependent.
        # GWMOCK_SIGNAL_CACHE_DIR is a base: the tables land in `.ephemeris-cache/ephemeris/`.
        env:
            GWMOCK_SIGNAL_CACHE_DIR: ${{ github.workspace }}/.ephemeris-cache
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: 'true'

            - name: Install dependencies
              env:
                  RESOLUTION: ${{ matrix.resolution }}
              run: |
                  if [ "$RESOLUTION" = "lowest-direct" ]; then
                      uv sync --group dev --upgrade --resolution lowest-direct
                  else
                      uv sync --group dev --upgrade
                  fi

            # The solar-system delays, on by default, need the LALPulsar ephemeris tables, which the
            # package fetches from git.ligo.org on first use and caches. Without this every job on every
            # run pulled ~16 MB from an external service -- and a scheduled release once failed when that
            # download timed out.
            #
            # The identifier is derived from `tests/data/ephemeris.sha256`, which records what the tables
            # should contain, so accepting new upstream content invalidates the cache in the same commit
            # that records it. `actions/cache` does not re-save on an exact hit, so a fixed identifier
            # would leave a newly added table downloading on every job.
            - name: Cache LALPulsar ephemeris tables
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ github.workspace }}/.ephemeris-cache
                  key:
                      lalpulsar-ephemeris-${{
                      hashFiles('tests/data/ephemeris.sha256') }}

            # Warms the cache on a miss and fails the job if it cannot, which reads better than tests
            # erroring with a stack trace ending in urllib. Reading the tables also verifies them: the
            # package refuses a default table whose SHA-256 is not the one it records, the same values as
            # `tests/data/ephemeris.sha256`. What the cache does not cover: GitHub evicts it after 7 days
            # without access, and fork pull requests never restore it.
            - name: Fetch and verify the ephemeris tables
              env:
                  FETCH: |
                      import sys
                      from gwmock_signal.projection.solar_system import SolarSystemEphemeris
                      try:
                          SolarSystemEphemeris().tables()
                      except ValueError as exc:
                          print(exc, file=sys.stderr)
                          sys.exit(2)
              run: |
                  # Exit 2 is a table refused for its content, cached or downloaded: retrying cannot fix it.
                  for attempt in 1 2 3; do
                      uv run --no-sync python -c "$FETCH" && exit 0 || status=$?
                      if [ "$status" -eq 2 ]; then
                          echo "::error::an ephemeris table was refused for its content (see above); retrying" \
                               "cannot fix that -- clear the cache, or update tests/data/ephemeris.sha256 and the package's record"
                          exit 1
                      fi
                      if [ "$attempt" -lt 3 ]; then
                          echo "ephemeris fetch attempt $attempt failed; retrying"
                          sleep $((attempt * 10))
                      fi
                  done
                  echo "::error::could not fetch or verify the LALPulsar ephemeris tables from git.ligo.org" \
                       "after three attempts; the projection's solar-system delays need them"
                  exit 1

            - name: Run tests with pytest
              run: uv run --no-sync pytest

            - name: Upload coverage to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

    test-core:
        # The newest Python, where h5py publishes no wheel yet. The package installs
        # with its core dependencies only, and the paths that need none of the optional packages
        # -- projection, injection, simulation with a registered model, the CLI, NumPy and HDF5 files --
        # work there without importing them. Only the package and pytest are installed, and the
        # tests run against the installed package rather than the source tree.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.15'

            - name: Install the package and pytest only
              run: |
                  uv venv
                  uv pip install . pytest

            - name: Run the core-dependency tests
              run: >-
                  uv run --no-sync pytest -p no:cacheprovider -o addopts= -o
                  pythonpath= tests/test_core_install.py
                  tests/test_data_reexports.py tests/io/test_hdf5.py

    test-jax:
        # Exercises the optional JAX/ripple waveform backend (the [jax] extra),
        # which is not part of the default install. Same matrix as `test`.
        strategy:
            matrix:
                python-version: ['3.13', '3.14']
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        env:
            GWMOCK_SIGNAL_CACHE_DIR: ${{ github.workspace }}/.ephemeris-cache
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: 'true'

            - name: Install dependencies with the JAX extra
              run: uv sync --group dev --extra jax --frozen

            # The solar-system delays, on by default, need the LALPulsar ephemeris tables, which the
            # package fetches from git.ligo.org on first use and caches. Without this every job on every
            # run pulled ~16 MB from an external service -- and a scheduled release once failed when that
            # download timed out.
            #
            # The identifier is derived from `tests/data/ephemeris.sha256`, which records what the tables
            # should contain, so accepting new upstream content invalidates the cache in the same commit
            # that records it. `actions/cache` does not re-save on an exact hit, so a fixed identifier
            # would leave a newly added table downloading on every job.
            - name: Cache LALPulsar ephemeris tables
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ github.workspace }}/.ephemeris-cache
                  key:
                      lalpulsar-ephemeris-${{
                      hashFiles('tests/data/ephemeris.sha256') }}

            # Warms the cache on a miss and fails the job if it cannot, which reads better than tests
            # erroring with a stack trace ending in urllib. Reading the tables also verifies them: the
            # package refuses a default table whose SHA-256 is not the one it records, the same values as
            # `tests/data/ephemeris.sha256`. What the cache does not cover: GitHub evicts it after 7 days
            # without access, and fork pull requests never restore it.
            - name: Fetch and verify the ephemeris tables
              env:
                  FETCH: |
                      import sys
                      from gwmock_signal.projection.solar_system import SolarSystemEphemeris
                      try:
                          SolarSystemEphemeris().tables()
                      except ValueError as exc:
                          print(exc, file=sys.stderr)
                          sys.exit(2)
              run: |
                  # Exit 2 is a table refused for its content, cached or downloaded: retrying cannot fix it.
                  for attempt in 1 2 3; do
                      uv run --no-sync python -c "$FETCH" && exit 0 || status=$?
                      if [ "$status" -eq 2 ]; then
                          echo "::error::an ephemeris table was refused for its content (see above); retrying" \
                               "cannot fix that -- clear the cache, or update tests/data/ephemeris.sha256 and the package's record"
                          exit 1
                      fi
                      if [ "$attempt" -lt 3 ]; then
                          echo "ephemeris fetch attempt $attempt failed; retrying"
                          sleep $((attempt * 10))
                      fi
                  done
                  echo "::error::could not fetch or verify the LALPulsar ephemeris tables from git.ligo.org" \
                       "after three attempts; the projection's solar-system delays need them"
                  exit 1

            # Unit tests with JAX installed: the importorskip'd ripple/JAX tests now run.
            - name: Run tests with pytest (JAX backend)
              run: uv run --frozen pytest

            # The ripple-vs-LAL overlap anchors are integration-marked. Run them
            # explicitly (scoped to the ripple suite so this job does not pull in
            # integration tests that need the pycbc/sgwb extras).
            - name: Run ripple-vs-LAL overlap anchors
              run:
                  uv run --frozen pytest -m integration
                  tests/waveform/test_ripple_backend.py

            # Upload the JAX-backend coverage too: the ripple/JAX lines run only
            # here (they importorskip in the default `test` job), so without this
            # codecov marks them uncovered on the patch. Flagged separately so the
            # two jobs' reports merge rather than overwrite.
            - name: Upload coverage to Codecov (JAX backend)
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  flags: jax

    test-integration:
        # The integration-marked tests, deselected by the default options, against every extra
        # (pycbc, sgwb, gwpy, jax, hdf5). The smoke tests are integration-marked too, but they check an
        # installed wheel and run in the publish workflows.
        runs-on: ubuntu-latest
        env:
            GWMOCK_SIGNAL_CACHE_DIR: ${{ github.workspace }}/.ephemeris-cache
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.13'
                  enable-cache: 'true'

            - name: Install dependencies with every extra
              run: uv sync --group dev --all-extras --frozen

            # The solar-system delays, on by default, need the LALPulsar ephemeris tables, which the
            # package fetches from git.ligo.org on first use and caches. Without this every job on every
            # run pulled ~16 MB from an external service -- and a scheduled release once failed when that
            # download timed out.
            #
