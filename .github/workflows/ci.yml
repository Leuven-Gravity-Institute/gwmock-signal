name: CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    workflow_call:

jobs:
    test:
        strategy:
            matrix:
                # Latest resolutions run everywhere; the SPEC 0 minimum
                # (lowest-direct) runs on ubuntu with the oldest supported
                # Python, since floor versions predate newer interpreters'
                # wheels.
                python-version: ['3.12', '3.13', '3.14']
                os: [ubuntu-latest, macos-latest]
                resolution: [highest]
                include:
                    - os: ubuntu-latest
                      python-version: '3.12'
                      resolution: lowest-direct
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: 'true'

            - name: Install dependencies
              env:
                  RESOLUTION: ${{ matrix.resolution }}
              run: |
                  if [ "$RESOLUTION" = "lowest-direct" ]; then
                      uv sync --group dev --upgrade --resolution lowest-direct
                  else
                      uv sync --group dev --upgrade
                  fi

            - name: Run tests with pytest
              run: uv run --no-sync pytest

            - name: Upload coverage to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

    test-jax:
        # Exercises the optional JAX/ripple waveform backend (the [jax] extra),
        # which is not part of the default install. Same matrix as `test`.
        strategy:
            matrix:
                python-version: ['3.12', '3.13', '3.14']
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        # Pins ripple's ephemeris cache to one path on every runner. Its default location is
        # platform-dependent -- ~/Library/Caches on macOS, $XDG_CACHE_HOME or ~/.cache
        # elsewhere -- so caching a single hard-coded path would silently miss on the macOS
        # jobs while appearing to work.
        env:
            RIPPLEGW_CACHE_DIR: ${{ github.workspace }}/.ephemeris-cache
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: 'true'

            - name: Install dependencies with the JAX extra
              run: uv sync --group dev --extra jax --frozen

            # The continuous-wave tests need LALPulsar ephemeris tables. ripple fetches them
            # from git.ligo.org on first use and caches them, so without this every job on
            # every run pulled ~16 MB from an external service -- and a scheduled release
            # failed when that download timed out. Cached under a fixed name, since the
            # tables are static data, so there is nothing to invalidate.
            - name: Cache LALPulsar ephemeris tables
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ github.workspace }}/.ephemeris-cache
                  key: lalpulsar-ephemeris-de405 # gitleaks:allow

            # Warms the cache on a miss. Deliberately non-fatal: a git.ligo.org outage must
            # not fail a release. When it does fail the continuous-wave tests skip and say
            # why, which the run summary shows.
            - name: Fetch ephemeris tables if not cached
              continue-on-error: true
              run: |
                  for attempt in 1 2 3; do
                      if uv run --frozen ripplegw-fetch-ephemeris \
                          earth00-40-DE405.dat.gz sun00-40-DE405.dat.gz; then
                          exit 0
                      fi
                      echo "ephemeris fetch attempt $attempt failed; retrying"
                      sleep $((attempt * 10))
                  done
                  echo "could not fetch the ephemeris; continuous-wave tests will skip"

            # Unit tests with JAX installed: the importorskip'd ripple/JAX tests now run.
            - name: Run tests with pytest (JAX backend)
              run: uv run --frozen pytest

            # The ripple-vs-LAL overlap anchors are integration-marked. Run them
            # explicitly (scoped to the ripple suite so this job does not pull in
            # integration tests that need the pycbc/sgwb extras).
            - name: Run ripple-vs-LAL overlap anchors
              run:
                  uv run --frozen pytest -m integration
                  tests/waveform/test_ripple_backend.py

            # Upload the JAX-backend coverage too: the ripple/JAX lines run only
            # here (they importorskip in the default `test` job), so without this
            # codecov marks them uncovered on the patch. Flagged separately so the
            # two jobs' reports merge rather than overwrite.
            - name: Upload coverage to Codecov (JAX backend)
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  flags: jax
