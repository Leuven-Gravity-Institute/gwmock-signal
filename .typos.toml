[default]
extend-ignore-re = [
  # === Block ignore: typos:off → typos:on ===
  # Supports:
  #   <!-- typos:off -->   ...   <!-- typos:on -->
  #   # typos:off          ...   # typos:on
  #   // typos:off         ...   // typos:on
  #   /* typos:off */      ...   /* typos:on */
  "(?s)(<!--|#|//|/\\*)\\s*typos:off.*?\\n\\s*(<!--|#|//|\\*/)\\s*typos:on",

  # === Single-line ignore ===
  # Example: some text with intentional typo  <!-- typos:disable-line -->
  # or: some text with intentional typo  # typos:disable-line
  "(?Rm)^.*(<!--|#|//)\\s*typos:disable-line\\s*.*?(-->)?$",

  # === Ignore next line ===
  # <!-- typos:ignore-next-line -->
  # next line with potential false positive
  "(<!--|#|//)\\s*typos:ignore-next-line\\s*.*?(-->)?\\n.*",
]

[default.extend-words]
# numpy function name, not a misspelling of "arrange"
arange = "arange"
# gravitational-wave term (spin precession), not a misspelling of "processing"
precessing = "precessing"
precession = "precession"
# the verb, for the axial precession of the equinoxes: a J2000 sky position is *precessed* into
# the frame of date. Same root as above, and equally not "process"
precess = "precess"
precessed = "precessed"
precesses = "precesses"
# post-Newtonian order, as in "the 1PN correction" -- not a misspelling of "ON"
PN = "PN"
"0PN" = "0PN"
"1PN" = "1PN"
"2PN" = "2PN"
"3PN" = "3PN"
