[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gwmock-signal"
authors = [{ name = "Isaac C. F. Wong" }]
description = "A Python package for simulating gravitational wave signals"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
  "typer>=0.16.0", # click 8.2 compatibility; the SPEC 0 floor (0.13) predates it
  # numpy and astropy were installed through GWpy; GWpy is now an extra, so they are declared.
  "numpy>=2.2",
  "astropy>=7.0",
  # Floor 7.26: the built-in detector table (data/lal_detectors.json) must equal LAL's registry,
  # and earlier releases define E2 and E3 (and, before 7.25, I1) differently.
  # lalsuite ships no wheel and no source distribution for Python 3.15 yet, so requiring it there
  # would make the package uninstallable. On 3.15 the LAL-based features are unavailable until a
  # cp315 wheel is published; drop the marker then.
  "lalsuite>=7.26; python_version < '3.15'",
  "pyyaml>=6.0",
  # The time series, its sampling grid and HDF5 I/O, shared by the gwmock packages.
  "gwmock-data>=0.3.0",
]

[project.optional-dependencies]
# HDF5 through h5py rather than gwmock-data's built-in writer and pyfive: faster, and gzip-compressed.
hdf5 = ["h5py>=3.12"]
# Conversion to and from GWpy series, and frame (GWF) output.
gwpy = ["gwpy>=4.0.0"]
pycbc = ["pycbc>=2.6.0"]
sgwb = ["gwmock-noise>=0.16.1"]
# Floor is 0.3: the backend calls ``ripplegw.waveform(name, **config)``, the registry factory
# that replaced the ``waveform_preset[name](...)`` mapping, so 0.2.x no longer works.
# Deliberately no upper bound, so a compatible newer ripple installs without a release here.
# What replaces the bound: `_require_ripple_interface` checks the API surface when the backend
# is constructed, so an incompatible version fails with a message naming the version and the
# missing names; and the interface tests in tests/waveform/test_waveform_arguments.py fail in
# the bump PR rather than at generation time.
# Floor is 0.3.1, the first release with the geocentre fix (GW-JAX-Team/ripple#141, issue #140).
# The continuous-wave backend generates polarizations at the *geocentre* so one projection route
# serves every source type; 0.3.0 and earlier return NaN for every sample there, because
# `arccos(lz / rd)` is 0/0 at the Earth centre. This floor is what makes that unreachable -- until
# 0.3.1 the fix was only available from a git revision, pinned in `[tool.uv.sources]`, which a
# published wheel cannot carry.
#
# Deliberately no upper bound, as with the 0.3 floor it replaces: `_require_ripple_interface`
# checks the API surface when the backend is constructed, and the interface tests fail in a bump PR
# rather than at generation time.
jax = ["ripplegw>=0.3.1"]

[tool.dependency-support-policy]
policy = "spec0"
groups = ["project", "optional"]
exclude = [
  "gwmock-noise",
  "gwmock-data",
] # ecosystem siblings: Renovate keeps them at latest
lock = "minimal"


[dependency-groups]
dev = [
  # The tests compare results with GWpy and exercise HDF5 through h5py; neither is a core dependency,
  # and neither publishes a wheel for Python 3.15 yet, where the tests that need them skip.
  "gwpy>=4.1.0; python_version < '3.15'",
  "h5py>=3.16.0; python_version < '3.15'",
  "ruff>=0.17.1",
  "prek>=0.5.5",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.16.0",
  "pytest>=9.1.1",
  "pytest-github-actions-annotate-failures>=0.4.2",
  "mutmut>=3.8.0",
]
docs = ["zensical>=0.0.70", "mkdocstrings-python>=2.0.9"]
build = ["hatch>=1.18.1"]
release = ["git-cliff>=2.14.2"]

[project.scripts]
gwmock-signal = "gwmock_signal.cli.main:app"

[project.urls]
Documentation = "https://leuven-gravity-institute.github.io/gwmock-signal"
Source = "https://github.com/Leuven-Gravity-Institute/gwmock-signal"
Tracker = "https://github.com/Leuven-Gravity-Institute/gwmock-signal/issues"
Home = "https://github.com/Leuven-Gravity-Institute/gwmock-signal"
"Release Notes" = "https://github.com/Leuven-Gravity-Institute/gwmock-signal/releases"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/gwmock_signal"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 0

[tool.pytest.ini_options]
addopts = "--cov-report xml:coverage.xml --cov src --cov-append -m 'not integration' --cov-report=term-missing"
pythonpath = ["src", "scripts"]
testpaths = "tests"
junit_family = "xunit2"
markers = [
  "integration: marks as integration test",
  "notebooks: marks as notebook test",
  "gpu: marks as gpu test",
  "spark: marks tests which need Spark",
  "slow: marks tests as slow",
  "unit: fast offline tests",
  # Skipped where the package is not installed: Python 3.15, where none publishes a wheel yet.
  "requires_h5py: needs h5py (the hdf5 extra)",
  "requires_gwpy: needs GWpy (the gwpy extra)",
  "requires_lalsuite: needs lalsuite (LAL detectors and waveforms)",
]

[tool.mutmut]
# mutmut copies the project into `mutants/` and mutates the copy, so the working tree is untouched.
source_paths = ["src/gwmock_signal"]
# `tests/`, `pyproject.toml` and `uv.lock` are copied by default. `examples/` is not, and
# tests/unit/test_network_file.py reads the real examples tree, so it has to come along or every
# mutant is judged against a suite that errors for reasons unrelated to the mutation.
also_copy = ["examples/"]
pytest_add_cli_args_test_selection = ["tests/"]
# The default `addopts` turn on coverage and an XML report. Under mutation testing they cost more
# than the test run itself and the report gets overwritten once per mutant, so the ini value is
# cleared and only the marker filter is restated. Integration and slow tests are excluded as well:
# a mutant is judged by the fast unit suite.
pytest_add_cli_args = [
  "--override-ini=addopts=",
  # The ini's `pythonpath` entries have to go too, and this one is load-bearing, not a speed-up.
  # mutmut puts `mutants/src` at the front of `sys.path` and deletes `src` from it, but pytest
  # re-inserts its `pythonpath` entries when it builds its config, so the real `src` lands back in
  # front of the mutated copy and every test imports unmutated code. mutmut then records no test
  # for any function and reports the whole package as "no tests". Clearing the ini leaves
  # `mutants/src` as the only source on the path.
  "--override-ini=pythonpath=",
  # `tests/test_release_version.py`, `tests/test_lal_constants_consistency.py` and
  # `tests/unit/test_detector_table.py` import modules from `scripts/`, which mutmut does not copy
  # into `mutants/` and which the cleared `pythonpath` above takes off the path. Without this the
  # import fails, pytest interrupts collection, and every mutant is then judged against a suite that
  # never ran. Skipped rather than made importable: the mutants come from `source_paths`, so a
  # tooling test can only add runtime here, never a verdict. Plain `pytest` runs them.
  "--ignore=tests/test_release_version.py",
  "--ignore=tests/test_lal_constants_consistency.py",
  "--ignore=tests/unit/test_detector_table.py",
  "-m",
  "not integration and not slow and not gpu and not spark and not notebooks",
]
# `mutate_only_covered_lines` is deliberately left off. It would cut the mutant count, but its
# coverage pass ends in `_unload_modules_not_in()`, which drops every module from `sys.modules`;
# the next in-process pytest run then re-imports numpy and dies with
# "ImportError: cannot load module more than once per process", because a C extension cannot be
# initialised twice in one interpreter.

[tool.ruff]
line-length = 120 # Matches Black's default
target-version = "py313" # Align with CI (3.13–3.15) and requires-python (>=3.13)
lint.extend-select = [
  "E",
  "F",
  "W",   # pycodestyle errors and warnings
  "I",   # isort rules
  "UP",  # pyupgrade rules
  "C90", # McCabe complexity
  "N",   # PEP8 naming
  "B",   # Bugbear (opinionated checks)
  "A",   # Flake8-builtins
  "C4",  # Flake8-comprehensions
  "PT",  # Flake8-pytest
  "RUF", # Ruff-specific rules
  "PL",  # Add pylint rules for fuller coverage
  "SIM", # Similarities
  "T10", # Debugger statements
  "DOC", # Docstring
  "D",   # Doc style
  "S",   # Security
]
lint.ignore = [
  "E501", # Line length (handled by formatter)
  "C901", # Disable overly strict complexity checks (optional, adjust as needed)
]
fix = true # Enable autofix
lint.unfixable = [] # List rules that should not be autofixed, if any

[tool.ruff.format]
quote-style = "double"       # Use double quotes for strings
indent-style = "space"       # Use spaces for indentation
docstring-code-format = true # Format code in docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in the tests directory
"tests/*" = ["S101", "ARG001", "PLC0415", "PLR2004"]
# S101: allow assert statements
# ARG001: allow unused function arguments (common in fixtures)
# PLC0415: allow import statements not at the top level
# PLR2004: allow magic values in the unit tests

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
