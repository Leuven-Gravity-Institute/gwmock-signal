[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gwmock-signal"
authors = [{ name = "Isaac C. F. Wong" }]
description = "A Python package for simulating gravitational wave signals"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
  "typer>=0.16.0",  # click 8.2 compatibility; the SPEC 0 floor (0.13) predates it
  "gwpy>=4.0.0",
  "lalsuite>=7.23",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
pycbc = ["pycbc>=2.5.0"]
sgwb = ["gwmock-noise>=0.10.0"]
# Floor is 0.3: the backend calls ``ripplegw.waveform(name, **config)``, the registry factory
# that replaced the ``waveform_preset[name](...)`` mapping, so 0.2.x no longer works.
# Deliberately no upper bound, so a compatible newer ripple installs without a release here.
# What replaces the bound: `_require_ripple_interface` checks the API surface when the backend
# is constructed, so an incompatible version fails with a message naming the version and the
# missing names; and the interface tests in tests/waveform/test_waveform_arguments.py fail in
# the bump PR rather than at generation time.
jax = ["ripplegw>=0.3"]

[tool.dependency-support-policy]
policy = "spec0"
groups = ["project", "optional"]
exclude = ["gwmock-noise"]       # ecosystem sibling: Renovate keeps it at latest
lock = "minimal"


[dependency-groups]
dev = [
  "ruff>=0.16.0",
  "prek>=0.4.11",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest>=9.1.1",
  "pytest-github-actions-annotate-failures>=0.4.2",
]
docs = ["zensical>=0.0.51", "mkdocstrings-python>=2.0.5"]
build = ["hatch>=1.17.1"]
release = ["git-cliff>=2.13.1"]

[project.scripts]
gwmock-signal = "gwmock_signal.cli.main:app"

[project.urls]
Documentation = "https://leuven-gravity-institute.github.io/gwmock-signal"
Source = "https://github.com/Leuven-Gravity-Institute/gwmock-signal"
Tracker = "https://github.com/Leuven-Gravity-Institute/gwmock-signal/issues"
Home = "https://github.com/Leuven-Gravity-Institute/gwmock-signal"
"Release Notes" = "https://github.com/Leuven-Gravity-Institute/gwmock-signal/releases"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/gwmock_signal"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 0

[tool.pytest.ini_options]
addopts = "--cov-report xml:coverage.xml --cov src --cov-append -m 'not integration' --cov-report=term-missing"
pythonpath = ["src"]
testpaths = "tests"
junit_family = "xunit2"
markers = [
  "integration: marks as integration test",
  "notebooks: marks as notebook test",
  "gpu: marks as gpu test",
  "spark: marks tests which need Spark",
  "slow: marks tests as slow",
  "unit: fast offline tests",
]

[tool.ruff]
line-length = 120 # Matches Black's default
target-version = "py312" # Align with CI (3.12–3.14) and requires-python (>=3.12)
lint.extend-select = [
  "E",
  "F",
  "W",   # pycodestyle errors and warnings
  "I",   # isort rules
  "UP",  # pyupgrade rules
  "C90", # McCabe complexity
  "N",   # PEP8 naming
  "B",   # Bugbear (opinionated checks)
  "A",   # Flake8-builtins
  "C4",  # Flake8-comprehensions
  "PT",  # Flake8-pytest
  "RUF", # Ruff-specific rules
  "PL",  # Add pylint rules for fuller coverage
  "SIM", # Similarities
  "T10", # Debugger statements
  "DOC", # Docstring
  "D",   # Doc style
  "S",   # Security
]
lint.ignore = [
  "E501", # Line length (handled by formatter)
  "C901", # Disable overly strict complexity checks (optional, adjust as needed)
]
fix = true # Enable autofix
lint.unfixable = [] # List rules that should not be autofixed, if any

[tool.ruff.format]
quote-style = "double"       # Use double quotes for strings
indent-style = "space"       # Use spaces for indentation
docstring-code-format = true # Format code in docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in the tests directory
"tests/*" = ["S101", "ARG001", "PLC0415", "PLR2004"]
# S101: allow assert statements
# ARG001: allow unused function arguments (common in fixtures)
# PLC0415: allow import statements not at the top level
# PLR2004: allow magic values in the unit tests

# TEMPORARY development pin. Remove when a ripplegw release contains the geocentre fix.
#
# `jax = ["ripplegw>=0.3"]` above is deliberately unbounded and stays that way: this table is
# development-only and is NOT carried into the published wheel, so nobody installing
# `gwmock-signal[jax]` from PyPI inherits a git dependency. (uv: "Sources are only respected by
# uv. If another tool is used, only the definitions in the standard project tables will be used."
# Build with `uv build --no-sources` to confirm that stays true.)
#
# Why it is needed: the continuous-wave backend generates polarizations at the *geocentre*, so the
# existing projection route can add the detector delay and antenna pattern -- one projection
# implementation for every source type rather than two. Released ripplegw returns NaN for every
# sample at `det_location_m = (0, 0, 0)`; `arccos(lz / rd)` is 0/0 there. Fixed upstream in
# GW-JAX-Team/ripple#141 (issue #140), pinned here to that commit until it is released.
#
# Removal: delete this table, run `uv lock`, and raise the floor in the `jax` extra to whichever
# release carries the fix. The CW backend's own version guard should be updated in the same change.
[tool.uv.sources]
ripplegw = { git = "https://github.com/GW-JAX-Team/ripple.git", rev = "400afb4" }

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
